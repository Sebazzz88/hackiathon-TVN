# docker compose up --build  →  http://localhost:8000  (interfaz + backend, sin red: LLM_OFFLINE=1, sin login)
# PENDIENTE: no probado en el equipo de desarrollo (no tiene Docker). La ruta principal de la demo es run_demo.ps1.
services:
  copiloto:
    build: .
    ports: ["8000:8000"]
    environment:
      AGENT_MODE: live
      LLM_OFFLINE: "1"
    volumes: ["./data:/app/data"]
